# Say More. 기존 자료는 저장소에 보관하고 영어 발음 학습 공간만 공개한다.
baseURL: "https://junxnpng.github.io/"   # GitHub Pages 사용자 사이트(루트). 워크플로가 같은 값으로 덮어쓴다
defaultContentLanguage: ko
locale: ko-KR
title: "Say More"
theme: PaperMod
enableRobotsTXT: true
enableEmoji: false
buildDrafts: false
buildFuture: false
timeZone: Asia/Seoul

module:
  mounts:
    - source: content/saymore
      target: content
    - source: static
      target: static
      files: [saymore/**, robots.txt]

outputs:
  home: [HTML]

disableKinds: [taxonomy, term, RSS]

menu:
  main:
    - {name: 홈, url: /, weight: 5, pre: '<b class="sm-tab-glyph" aria-hidden="true">⌂</b>'}
    - {name: IPA, url: /saymore/ipa/, weight: 10, pre: '<b class="sm-tab-glyph" aria-hidden="true">/ɪ/</b>'}
    - {name: 듣기, url: /saymore/listen/, weight: 15, pre: '<b class="sm-tab-glyph" aria-hidden="true">r·l</b>'}
    - {name: 카드, url: /saymore/cards/, weight: 20, pre: '<b class="sm-tab-glyph" aria-hidden="true">Aa</b>'}
    - {name: 형태, url: /saymore/forms/, weight: 25, pre: '<b class="sm-tab-glyph" aria-hidden="true">-ed</b>'}
    - {name: 문장, url: /saymore/order/, weight: 30, pre: '<b class="sm-tab-glyph" aria-hidden="true">S·V</b>'}

params:
  env: production
  description: "Fluent Forever의 발음 우선 학습에서 영감을 받은 나만의 영어 회화 연습실."
  defaultTheme: auto
  disableThemeToggle: true    # the Theme button (static/saymore/skin.js) picks the skin instead
  ShowReadingTime: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  hideSummary: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  math: false                 # 글마다 front matter `math: true` 로 켠다
  label:
    text: "Say More"
  assets:
    favicon: saymore/icons/speech.svg
    favicon16x16: saymore/icons/speech-16.png
    favicon32x32: saymore/icons/speech-32.png
    apple_touch_icon: saymore/icons/speech-180.png
    safari_pinned_tab: saymore/icons/speech.svg
    disableHLJS: true         # Chroma 사용
    disableFingerprinting: false
  fuseOpts:
    isCaseSensitive: false
    threshold: 0.35
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]

markup:
  goldmark:
    renderer:
      unsafe: true            # 다시 그린 mermaid 등 raw HTML 허용
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
