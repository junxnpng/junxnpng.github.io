# Hugo + PaperMod. 뼈대는 영어, 논문 노트 본문은 한국어 요약. 논문 노트와 카탈로그는 athena-papers 가 만들어 내보낸다.
baseURL: "https://junxnpng.github.io/"   # GitHub Pages 사용자 사이트(루트). 워크플로가 같은 값으로 덮어쓴다
languageCode: en-us
title: "Jun Heo"
theme: PaperMod
enableRobotsTXT: true
enableEmoji: false
buildDrafts: false
buildFuture: false
timeZone: Asia/Seoul

pagination:
  pagerSize: 10   # 홈 = 최근 10편 + 다음 페이지 (2026-09-06 결정)

outputs:
  home: [HTML, RSS, JSON]   # JSON = 검색 색인

taxonomies:
  category: categories      # 분야 10개
  tag: tags                 # 번역 깊이 · 주제 칩

menu:
  main:
    - {name: Papers, url: /papers/, weight: 10}         # 카탈로그 (static/papers/index.html — athena-papers 가 내보냄)
    - {name: Notes, url: /notes/, weight: 20}           # 논문 노트 (content/notes — athena-papers 가 내보냄)
    - {name: Publications, url: /publications/, weight: 30}  # data/publications.yaml
    - {name: CV, url: /cv/, weight: 40}
    - {name: About, url: /about/, weight: 50}
    - {name: Search, url: /search/, weight: 60}
    # Archive · Tags 는 홈 소개문에서 링크한다

params:
  env: production
  mainSections: [notes, posts]   # 홈 목록 = 논문 노트 + 일반 글
  description: "Reading notes on LLM inference and serving systems."
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  hideSummary: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  math: false                 # 글마다 front matter `math: true` 로 켠다
  label:
    text: "Jun Heo"
  homeInfoParams:               # Home-Info 모드: 홈 맨 위에 소개, 아래에 최신 글
    Title: "Jun Heo"
    Content: >
      Reading notes on LLM inference and serving systems — KV cache, disaggregated serving, scheduling,
      and the hardware path underneath. Notes are in Korean; everything else is in English.
      Browse the [paper catalog](/papers/), the [archive](/archives/), or by [tag](/tags/).
  socialIcons:
    - {name: github, url: "https://github.com/junxnpng"}
    - {name: rss, url: "/index.xml"}
  assets:
    disableHLJS: true         # Chroma 사용
    disableFingerprinting: false
  fuseOpts:
    isCaseSensitive: false
    threshold: 0.35
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]

markup:
  goldmark:
    renderer:
      unsafe: true            # 다시 그린 mermaid 등 raw HTML 허용
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
