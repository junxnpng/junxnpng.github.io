# Say More. 기존 자료는 저장소에 보관하고 영어 발음 학습 공간만 공개한다.
baseURL: "https://junxnpng.github.io/"   # GitHub Pages 사용자 사이트(루트). 워크플로가 같은 값으로 덮어쓴다
languageCode: ko-kr
title: "Say More"
theme: PaperMod
enableRobotsTXT: true
enableEmoji: false
buildDrafts: false
buildFuture: false
timeZone: Asia/Seoul

module:
  mounts:
    - source: content/saymore
      target: content
    - source: static
      target: static
      files: [saymore/**, robots.txt]

outputs:
  home: [HTML]

disableKinds: [taxonomy, term, RSS]

menu:
  main:
    - {name: IPA, url: /saymore/ipa/, weight: 10}

params:
  env: production
  description: "Fluent Forever의 발음 우선 학습에서 영감을 받은 나만의 영어 회화 연습실."
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  hideSummary: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  math: false                 # 글마다 front matter `math: true` 로 켠다
  label:
    text: "Say More"
  assets:
    disableHLJS: true         # Chroma 사용
    disableFingerprinting: false
  fuseOpts:
    isCaseSensitive: false
    threshold: 0.35
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]

markup:
  goldmark:
    renderer:
      unsafe: true            # 다시 그린 mermaid 등 raw HTML 허용
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
