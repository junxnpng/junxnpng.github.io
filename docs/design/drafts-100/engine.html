<style>

:root[data-theme="dark"]{--bg:#0e1116;--fg:#eceff3;--sub:#98a2b0;--rule:#2a313b;--chip:#1a2029;--pick:#9db0ff;--pick-ink:#10141a;--star:#ffd257;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--ui);word-break:keep-all;padding-block:26px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.draft.wide{grid-column:1/-1}

.body{padding:14px 16px 18px}

  <div class="hero"><div><p class="eye">SAY MORE · AMERICAN ENGLISH</p><h3>한 소리씩,<br>내 영어로.</h3><p class="lead">영어의 소리를 구별하고, 입으로 익히는 나만의 연습실.</p><span class="btn">오늘 복습 시작 →</span></div>
   <div class="spec" lang="en"><p><span class="w">sh<mark>i</mark>p</span><span class="p">/ʃ<mark>ɪ</mark>p/</span></p><p><span class="w">sh<mark>ee</mark>p</span><span class="p">/ʃ<mark>iː</mark>p/</span></p></div></div>
  <div class="tiles"><div class="tile"><em>/ɪ/ ↔ /iː/</em><strong>IPA · 미국식 발음</strong><small>기호를 읽고 혀의 위치를 비교</small></div><div class="tile"><em>r ↔ l</em><strong>듣기 훈련</strong><small>소리 하나만 다른 두 단어</small></div><div class="tile"><em>Aa</em><strong>단어 카드</strong><small>만들고, 정한 날에 복습</small></div></div>
 </div>
 <div class="review">
  <div class="tabs"><span>카드 목록</span><span>카드 추가</span><span class="on">복습하기</span></div>
  <div class="prog"><span>오늘 복습 12 / 37</span><span>첫 625단어</span></div>
  <div class="card"><div class="pic">${cup}</div><div class="body"><p class="ans" lang="en">coffee</p><p class="ipa">/ˈkɑː.fi/</p><div class="listen"><span>▶ 사람 녹음</span><span>▶ 기기 음성</span></div></div></div>
  <div class="rate"><span>모름<small>1일 안</small></span><span>어려움<small>3일</small></span><span>알맞음<small>8일</small></span><span>쉬움<small>15일</small></span></div>
 </div></div>`;
const pad=n=>String(n).padStart(3,'0');
let stars=new Set();try{stars=new Set(JSON.parse(localStorage.getItem('saymore.drafts.stars')||'[]'))}catch{}
const save=()=>{try{localStorage.setItem('saymore.drafts.stars',JSON.stringify([...stars]))}catch{}};
const state={fam:'all',pick:false,star:stars.size>0};
const list=document.getElementById('list'),bar=document.getElementById('bar');
document.getElementById('intro').textContent=INTRO;
function fitAll(){for(const f of list.querySelectorAll('.frame')){const m=f.firstElementChild,w=f.clientWidth;const stack=w<520;m.classList.toggle('stack',stack);m.style.zoom=w/(stack?470:920)}}
function render(){
  const shown=THEMES.map((t,i)=>({t,i})).filter(({t,i})=>(state.fam==='all'||t.f===state.fam)&&(!state.pick||t.p)&&(!state.star||stars.has(i+1)));
  let html='',last='';
  for(const {t,i} of shown){
    if(t.f!==last){last=t.f;html+=`<div class="fam"><h2>${t.f}</h2><p>${FAMILIES[t.f]||''}</p></div>`}
    html+=`<section class="draft" id="d${i+1}"><div class="cap"><b><i>${pad(i+1)}</i>${t.n}${t.p?'<u>추천</u>':''}</b><span>${t.d}</span>${t.ref?`<small>참고: ${t.ref}</small>`:''}<div><button type="button" data-star="${i+1}" aria-pressed="${stars.has(i+1)}">★ 찜</button><button type="button" data-wide>크게</button></div></div><div class="frame">${mock(t)}</div></section>`;
  }
  list.innerHTML=html||'<p>조건에 맞는 초안이 없습니다. 위의 단추를 다시 눌러 풀어 주세요.</p>';
  const fams=['all',...Object.keys(FAMILIES)];
  bar.innerHTML=fams.map(f=>`<button type="button" data-fam="${f}" aria-pressed="${state.fam===f}">${f==='all'?'전체':f}</button>`).join('')+`<span class="sep"></span><button type="button" data-pick aria-pressed="${state.pick}">추천만</button><button type="button" data-starred aria-pressed="${state.star}">${state.star?'전체 다시 보기':'★ 찜한 것만 ('+stars.size+')'}</button><output>${shown.length}개 표시${stars.size?' · 찜: '+[...stars].sort((a,b)=>a-b).map(pad).join(', '):''}</output>`;
  fitAll();
}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fam)state.fam=b.dataset.fam;else if('pick'in b.dataset)state.pick=!state.pick;else if('starred'in b.dataset)state.star=!state.star;render()});
list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.star){const n=+b.dataset.star;stars.has(n)?stars.delete(n):stars.add(n);save();const y=scrollY;render();scrollTo(0,y)}else if('wide'in b.dataset){const d=b.closest('.draft');d.classList.toggle('wide');b.textContent=d.classList.contains('wide')?'작게':'크게';fitAll()}});
addEventListener('resize',fitAll);
render();document.fonts&&document.fonts.ready.then(fitAll);
</script>
